<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A quiet map of meaningful places." />
    <meta name="theme-color" content="#f5f6f2" />
    <title>The Places We Met | Fieldnotes</title>
    <link rel="stylesheet" href="journey.css" />
  </head>
  <body>
    <main class="journey-page">
      <header class="masthead">
        <p class="wordmark">FIELDNOTES <span>/</span> OUR STORY</p>
        <p class="edition">Places we have shared</p>
      </header>

      <section class="map-section" aria-label="Map of places we met">
        <div class="map-heading">
          <div>
            <p class="eyebrow">A MAP OF OUR SHARED MOMENTS</p>
            <h1>The places we met.</h1>
          </div>
          <div class="map-tools" aria-label="Map controls">
            <button class="tool-button" id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">
              <span aria-hidden="true">−</span>
            </button>
            <button class="tool-button" id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">
              <span aria-hidden="true">+</span>
            </button>
            <button class="tool-button reset-button" id="reset-map" type="button" aria-label="Show whole world" title="Show whole world">
              <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.1" /><path d="M3 10h14M10 3a11 11 0 0 1 0 14M10 3a11 11 0 0 0 0 14" /></svg>
            </button>
          </div>
        </div>

        <div class="map-stage">
          <div class="map-frame" id="map-frame">
            <div class="map-wash" aria-hidden="true"></div>
            <div class="map-art" id="map-art">
              <img class="world-map" src="assets/world-map.svg" alt="" draggable="false" />
              <div class="pins" id="pins" aria-label="Places"></div>
            </div>
            <p class="empty-state" id="empty-state" hidden>No places to show yet.</p>
          </div>
          <aside class="event-card" id="event-card" aria-live="polite" aria-atomic="true" hidden>
            <button class="card-close" id="close-card" type="button" aria-label="Close place details">×</button>
            <p class="card-kicker">A PLACE IN TIME</p>
            <h2 id="event-city"></h2>
            <p class="event-date" id="event-date"></p>
          </aside>
        </div>
      </section>

      <footer class="page-footer">
        <p><span class="footer-dot" aria-hidden="true"></span><span id="place-count">0 places</span></p>
        <p>Every place has its own story.</p>
      </footer>
    </main>
    <script src="journey.js"></script>
  </body>
</html>
